<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySafePlace – Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style>
    body { background: var(--msp-fundo); }
    .msp-header { background: var(--msp-verde-escuro); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    .msp-header .logo { font-size: 1.2rem; font-weight: 800; color: white; }
    .msp-header nav a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.88rem; font-weight: 600; margin-left: 16px; }
    .msp-header nav a:hover { color: white; }
    .card { border: 1px solid var(--msp-cinza-borda) !important; border-radius: var(--msp-radius) !important; box-shadow: var(--msp-sombra) !important; }
    .hidden { display: none; }
    label { margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: var(--msp-cinza-texto); }
    .form-control { border: 1.5px solid var(--msp-cinza-borda) !important; font-family: var(--msp-fonte) !important; }
    .form-control:focus { border-color: var(--msp-verde-claro) !important; box-shadow: 0 0 0 3px rgba(30,92,56,0.12) !important; }
    .list-group-item { display: flex; justify-content: space-between; align-items: center; border-color: var(--msp-cinza-borda) !important; }
    @media (max-width: 480px) { .msp-header nav { display: none; } .container { padding: 12px !important; } }
  </style>
</head>
<body>
  <div class="msp-header">
    <div class="logo">🧠 MySafePlace</div>
    <nav>
      <a href="#">Início</a>
      <a href="#">Consultas</a>
      <a href="#">Chat</a>
    </nav>
  </div>

  <div class="container mt-4">
    <div class="card shadow-sm p-4 mx-auto" style="max-width:420px;">
      <h5 class="text-center mb-3 fw-bold" style="color:var(--msp-verde-escuro);">Meu Perfil</h5>
      <h4 id="nome" class="text-center fw-bold"></h4>
      <hr style="border-color:var(--msp-cinza-borda);">
      <p id="email" class="text-center text-muted mb-1"></p>
      <p id="telefone" class="text-center mb-1"></p>
      <p id="cidade" class="text-center mb-3"></p>
      <div class="d-flex justify-content-center gap-2 mt-3">
        <button class="btn btn-primary" onclick="editar()">Editar</button>
        <button class="btn btn-outline-danger" onclick="logout()">Sair</button>
        <a href="favoritos.html" class="btn btn-success">Favoritos</a>
      </div>
    </div>

    <div id="form-edicao" class="card shadow-sm p-4 mx-auto mt-4 hidden" style="max-width:420px;">
      <h5 class="text-center mb-3 fw-bold" style="color:var(--msp-verde-escuro);">Editar Perfil</h5>
      <label for="editNome">Nome:</label>
      <input type="text" id="editNome" class="form-control mb-2">
      <label for="editEmail">E-mail:</label>
      <input type="email" id="editEmail" class="form-control mb-2">
      <label for="editTelefone">Telefone:</label>
      <input type="text" id="editTelefone" class="form-control mb-2">
      <label for="editCidade">Cidade:</label>
      <input type="text" id="editCidade" class="form-control mb-3">
      <div class="d-flex justify-content-center gap-2">
        <button class="btn btn-success" onclick="salvar()">Salvar</button>
        <button class="btn btn-secondary" onclick="cancelar()">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL_USUARIO = "http://localhost:3000/usuarios/1";
    async function carregarPerfil() {
      try {
        const perfil = await fetch(API_URL_USUARIO).then(r => r.json());
        document.getElementById("nome").textContent = perfil.nome;
        document.getElementById("email").textContent = perfil.email;
        document.getElementById("telefone").textContent = perfil.telefone;
        document.getElementById("cidade").textContent = perfil.cidade;
        document.getElementById("editNome").value = perfil.nome;
        document.getElementById("editEmail").value = perfil.email;
        document.getElementById("editTelefone").value = perfil.telefone;
        document.getElementById("editCidade").value = perfil.cidade;
      } catch (e) { console.error(e); }
    }
    function editar() { document.getElementById("form-edicao").classList.remove("hidden"); }
    function cancelar() { document.getElementById("form-edicao").classList.add("hidden"); }
    async function salvar() {
      await fetch(API_URL_USUARIO, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nome: document.getElementById("editNome").value, email: document.getElementById("editEmail").value, telefone: document.getElementById("editTelefone").value, cidade: document.getElementById("editCidade").value }) });
      cancelar(); carregarPerfil();
    }
    function logout() { alert("Sessão encerrada!"); window.location.href = "index.html"; }
    carregarPerfil();
  </script>
</body>
</html>
