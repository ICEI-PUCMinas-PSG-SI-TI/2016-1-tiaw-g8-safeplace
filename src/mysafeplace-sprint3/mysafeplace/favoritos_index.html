<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySafePlace – Favoritos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style>
    body { background: var(--msp-fundo); }
    .msp-header { background: var(--msp-verde-escuro); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    .msp-header .logo { font-size: 1.2rem; font-weight: 800; color: white; }
    .msp-header nav a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.88rem; font-weight: 600; margin-left: 16px; }
    .msp-header nav a:hover { color: white; }
    .card { border: 1px solid var(--msp-cinza-borda) !important; border-radius: var(--msp-radius) !important; }
    .list-group-item { display: flex; justify-content: space-between; align-items: center; border-color: var(--msp-cinza-borda) !important; padding: 14px 16px; }
    @media (max-width: 480px) { .msp-header nav { display: none; } .list-group-item { flex-direction: column; align-items: flex-start; gap: 10px; } }
  </style>
</head>
<body>
  <div class="msp-header">
    <div class="logo">🧠 MySafePlace</div>
    <nav>
      <a href="perfil_index.html">← Perfil</a>
      <a href="#">Início</a>
    </nav>
  </div>

  <div class="container mt-4">
    <div class="card shadow-sm p-4 mx-auto" style="max-width:600px;">
      <h5 class="text-center mb-3 fw-bold" id="tituloFavoritos" style="color:var(--msp-verde-escuro);">Meus Favoritos</h5>
      <ul id="listaFavoritos" class="list-group list-group-flush"></ul>
      <div class="d-flex justify-content-center mt-3">
        <a href="perfil_index.html" class="btn btn-outline-primary">← Voltar ao Perfil</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL_USUARIO = "http://localhost:3000/usuarios/1";
    async function carregarFavoritos() {
      try {
        const usuario = await fetch(API_URL_USUARIO).then(r => r.json());
        document.getElementById("tituloFavoritos").textContent = `Favoritos de ${usuario.nome}`;
        const favoritos = await fetch(`http://localhost:3000/favoritos?usuarioId=${usuario.id}`).then(r => r.json());
        const lista = document.getElementById("listaFavoritos");
        lista.innerHTML = "";
        if (favoritos.length === 0) { lista.innerHTML = "<li class='list-group-item text-center text-muted'>Nenhum favorito encontrado.</li>"; return; }
        for (const fav of favoritos) {
          const artigo = await fetch(`http://localhost:3000/artigos/${fav.artigoId}`).then(r => r.json());
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.innerHTML = `<div><strong>${artigo.titulo}</strong><br><small class="text-muted">${artigo.autor} · ${artigo.data}</small></div><div class="d-flex gap-2"><button class="btn btn-sm btn-primary" onclick="verArtigo(${artigo.id})">Ver</button><button class="btn btn-sm btn-outline-danger" onclick="removerFavorito(${fav.id})">Remover</button></div>`;
          lista.appendChild(li);
        }
      } catch (e) { console.error(e); }
    }
    function verArtigo(id) {
      const artigo = document.querySelector(`[data-artigo-id="${id}"]`);
      const titulo = artigo ? artigo.dataset.titulo : 'artigo';
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#1e5c38;color:#fff;padding:14px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.2);z-index:9999;max-width:320px;line-height:1.5;';
      toast.textContent = '📄 Funcionalidade de leitura de artigos em breve!';
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity='0'; toast.style.transition='opacity 0.3s'; setTimeout(function(){ toast.remove(); }, 300); }, 3000);
    }
    async function removerFavorito(id) {
      if (!confirm("Remover dos favoritos?")) return;
      await fetch(`http://localhost:3000/favoritos/${id}`, { method: "DELETE" });
      carregarFavoritos();
    }
    carregarFavoritos();
  </script>
</body>
</html>
