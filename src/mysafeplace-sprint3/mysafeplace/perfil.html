<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <i class="fa-regular fa-clock"></i>
        <span>tempo real</span>
    </div>

    <div class="header-right">
        <button id="toggleTema" class="btn-icon">
            <i class="fa-solid fa-moon"></i>
        </button>

        <img id="fotoTopo"
             class="avatar"
             src="https://via.placeholder.com/50">

        <div class="usuario-header">
            <strong id="nomeHeader">João Silva</strong>
        </div>
    </div>
</header>

<main class="container">

    <section class="titulo">
        <h1>Perfil do usuário</h1>
        <p>Gerencie suas informações pessoais e preferências da conta.</p>
    </section>

    <section class="perfil-card">
        <div class="perfil-info">
            <div class="foto-container">
                <img id="fotoPerfil"
                     src="https://via.placeholder.com/150">

                <label for="fotoInput" class="camera-btn">
                    <i class="fa-solid fa-camera"></i>
                </label>

                <input
                    type="file"
                    id="fotoInput"
                    accept="image/*">
            </div>

            <div>
                <h2 id="nomePerfil">João Silva</h2>
                <p id="emailPerfil">joao@email.com</p>
                <p>Membro desde: 12/03/2024</p>
            </div>
        </div>
        <button class="btn-secundario">
            Editar Perfil
        </button>
    </section>

    <section class="grid">

        <div class="card">
            <h3>Informações pessoais</h3>
            <label>Nome completo</label>
            <input type="text" id="nome">

            <label>E-mail</label>
            <input type="email" id="email">

            <label>Telefone</label>
            <input type="text" id="telefone">

            <label>Fuso horário</label>
            <select id="fuso">
                <option>(GMT-03:00) Brasília</option>
                <option>(GMT-04:00) Manaus</option>
            </select>

            <button id="salvarPerfil" class="btn-principal">
                Salvar alterações
            </button>
        </div>

        <div class="card">
            <h3>Preferências</h3>
            <label>Tipo de usuário</label>
            <div class="opcoes">
                <button class="tipo ativo">Aluno</button>
                <button class="tipo">Professor</button>
                <button class="tipo">Responsável</button>
            </div>

            <label>Tema</label>
            <div class="opcoes">
                <button id="temaClaro" class="ativo">
                    Claro
                </button>

                <button id="temaEscuro">
                    Escuro
                </button>
            </div>

            <label>Idioma</label>
            <select id="idioma">
                <option>Português (Brasil)</option>
                <option>English</option>
            </select>

            <div class="switch-area">
                <span>Notificações</span>
                <input
                    type="checkbox"
                    id="notificacoes">
            </div>

            <button id="salvarPreferencias"
                    class="btn-principal">
                Salvar preferências
            </button>
        </div>
    </section>

    <section class="card">
        <h3>Segurança</h3>

        <div class="item-menu"
             onclick="window.location.href='alterarsenha.html'">
            <span>Alterar senha</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>
    </section>

    <section class="card">
        <h3>Conta</h3>

        <div class="item-menu danger"
             onclick="window.location.href='excluirconta.html'">
            <span>Excluir conta</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>
    </section>
</main>
<script src="perfil.js"></script>

</body>
</html>
