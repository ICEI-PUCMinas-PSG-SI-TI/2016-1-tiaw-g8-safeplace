<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySafePlace – Avaliação de Psicólogos</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/global.css">
    <style>
        body { background:var(--msp-fundo); }
        .msp-header { background:var(--msp-verde-escuro); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
        .msp-header .logo { font-family:'Nunito',sans-serif; font-size:1.2rem; font-weight:800; color:white; text-decoration:none; }
        .msp-header nav a { color:rgba(255,255,255,0.8); text-decoration:none; font-size:0.88rem; font-weight:600; margin-left:4px; }
        .msp-header nav a:hover, .msp-header nav a.active { color:white; font-weight:700; }
        .msp-header nav { display:flex; gap:4px; align-items:center; }
        .hero { background:linear-gradient(135deg,var(--msp-verde-escuro),var(--msp-verde-medio)); color:white; padding:2rem 1rem; text-align:center; }
        .hero h1 { font-size:1.6rem; font-weight:800; margin-bottom:6px; }
        .hero p { opacity:0.85; font-size:0.95rem; }
        .container { max-width:700px; margin:0 auto; padding:24px 16px 48px; }
        .form-card { background:white; border:1px solid var(--msp-cinza-borda); border-radius:var(--msp-radius); padding:24px; margin-bottom:24px; box-shadow:var(--msp-sombra); }
        .form-card h2 { font-size:1rem; font-weight:700; color:var(--msp-verde-escuro); margin-bottom:16px; }
        .form-card input, .form-card select, .form-card textarea { width:100%; padding:10px 14px; margin-bottom:12px; border:1.5px solid var(--msp-cinza-borda); border-radius:8px; font-family:var(--msp-fonte); font-size:0.9rem; background:var(--msp-fundo); }
        .form-card textarea { resize:none; height:90px; }
        .btn-enviar { width:100%; padding:12px; background:var(--msp-verde-medio); color:white; border:none; border-radius:8px; font-family:var(--msp-fonte); font-size:0.95rem; font-weight:700; cursor:pointer; }
        .btn-enviar:hover { background:var(--msp-verde-escuro); }
        .avaliacao { background:white; border:1px solid var(--msp-cinza-borda); border-left:4px solid var(--msp-verde-claro); border-radius:var(--msp-radius); padding:16px 20px; margin-bottom:12px; box-shadow:var(--msp-sombra); }
        .avaliacao h3 { font-size:0.97rem; font-weight:700; color:var(--msp-verde-escuro); margin-bottom:8px; }
        .avaliacao p { font-size:0.87rem; color:var(--msp-cinza-texto); margin-bottom:4px; }
        .avaliacao-acoes { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
        .btn-ed, .btn-ex { padding:6px 14px; border-radius:8px; font-family:var(--msp-fonte); font-size:0.82rem; font-weight:600; cursor:pointer; border:none; }
        .btn-ed { background:var(--msp-verde-bg); color:var(--msp-verde-escuro); }
        .btn-ex { background:#fdecea; color:var(--msp-perigo); }
        .btn-ex:hover { background:var(--msp-perigo); color:white; }
        @media (max-width:480px) { .msp-header nav{display:none;} }
    </style>
</head>
<body>
    <div class="msp-header">
        <a href="../index.html" class="logo">my<span style="color:#a8e6c1;">SafePlace</span></a>
        <nav>
            <a href="../index.html">Início</a>
            <a href="../agendamento/index.html">Consultas</a>
            <a href="../chat/index.html">Chat</a>
            <a href="../avaliacoes/index.html" class="active">Avaliações</a>
            <a href="../perfil/index.html">Perfil</a>
            <a href="../agenda/index.html">Agenda</a>
            <a href="../diario/index.html">Diário</a>
            <a href="../artigos/index.html">Artigos</a>
        </nav>
    </div>
    <div class="hero">
        <h1>Avaliação de Psicólogos</h1>
        <p>Compartilhe sua experiência e ajude outros pacientes.</p>
    </div>
    <div class="container">
        <div class="form-card">
            <h2>Nova Avaliação</h2>
            <form id="form-avaliacao">
                <input type="text" id="paciente" placeholder="Seu nome" required>
                <input type="text" id="psicologo" placeholder="Nome do psicólogo" required>
                <select id="nota" required>
                    <option value="">Selecione uma nota</option>
                    <option value="1">⭐ 1</option>
                    <option value="2">⭐⭐ 2</option>
                    <option value="3">⭐⭐⭐ 3</option>
                    <option value="4">⭐⭐⭐⭐ 4</option>
                    <option value="5">⭐⭐⭐⭐⭐ 5</option>
                </select>
                <textarea id="comentario" placeholder="Escreva sua avaliação..." required></textarea>
                <button type="submit" class="btn-enviar">Enviar Avaliação</button>
            </form>
        </div>
        <div id="lista-avaliacoes"></div>
    </div>
    <script src="../shared/supabase.js"></script>
    <script>
        document.getElementById('form-avaliacao').addEventListener('submit', async (e) => {
            e.preventDefault();
            await db.post('avaliacoes', {
                paciente: document.getElementById('paciente').value,
                psicologo: document.getElementById('psicologo').value,
                nota: parseInt(document.getElementById('nota').value),
                comentario: document.getElementById('comentario').value,
                data: new Date().toLocaleDateString('pt-BR')
            });
            document.getElementById('form-avaliacao').reset();
            carregarAvaliacoes();
        });
        async function carregarAvaliacoes() {
            const avaliacoes = await db.get('avaliacoes');
            const lista = document.getElementById('lista-avaliacoes');
            lista.innerHTML = '';
            avaliacoes.forEach(av => {
                const div = document.createElement('div');
                div.className = 'avaliacao';
                div.innerHTML = `<h3>${av.psicologo}</h3>
                <p><strong>Paciente:</strong> ${av.paciente}</p>
                <p><strong>Nota:</strong> ${av.nota} ⭐</p>
                <p><strong>Comentário:</strong> ${av.comentario}</p>
                <p><strong>Data:</strong> ${av.data}</p>
                <div class="avaliacao-acoes">
                    <button class="btn-ed" onclick="editarAvaliacao('${av.id}')">✏️ Editar</button>
                    <button class="btn-ex" onclick="excluirAvaliacao('${av.id}')">🗑️ Excluir</button>
                </div>`;
                lista.appendChild(div);
            });
        }
        async function excluirAvaliacao(id) {
            if (!confirm('Excluir esta avaliação?')) return;
            await db.delete('avaliacoes', id);
            carregarAvaliacoes();
        }
        async function editarAvaliacao(id) {
            const novo = prompt('Novo comentário:');
            if (!novo) return;
            await db.patch('avaliacoes', id, { comentario: novo });
            carregarAvaliacoes();
        }
