<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mySafePlace – Todos os Artigos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />

</head>

<body>

    <nav class="navbar navbar-expand-lg" id="navbar-principal">
        <div class="container">
            <a class="navbar-brand" href="../index.html">my<span class="marca-destaque">SafePlace</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="../agendamento/index.html">Consultas</a></li>
                    <li class="nav-item"><a class="nav-link" href="../chat/index.html">Chat</a></li>
                    <li class="nav-item"><a class="nav-link" href="../avaliacoes/index.html">Avaliações</a></li>
                    <li class="nav-item"><a class="nav-link" href="../perfil/index.html">Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="../agenda/index.html">Agenda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../diario/index.html">Diário</a></li>
                    <li class="nav-item"><a class="nav-link active" href="index.html">Artigos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="secao-filtros">
        <div class="container">
            <form id="form-filtros" class="row g-3 align-items-center" onsubmit="event.preventDefault();">
                <div class="col-12 col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"
                            style="border: 1.5px solid #c5ddd0; border-radius: 8px 0 0 8px;">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="input-busca" class="form-control border-start-0"
                            placeholder="Pesquisar artigos por título, conteúdo ou tags..."
                            style="border-radius: 0 8px 8px 0;" />
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <select id="select-categoria" class="form-select">
                        <option value="">Todas as categorias</option>
                        <option value="Ansiedade">Ansiedade</option>
                        <option value="Depressão">Depressão</option>
                        <option value="Mindfulness">Mindfulness</option>
                        <option value="Estresse">Estresse</option>
                        <option value="Terapia">Terapia</option>
                        <option value="Autocuidado">Autocuidado</option>
                        <option value="TDAH">TDAH</option>
                        <option value="Crise Emocional">Crise Emocional</option>
                    </select>
                </div>
                <div class="col-12 col-md-2 text-md-end">
                    <span id="contador-resultados" class="text-muted small fw-bold"></span>
                </div>
            </form>
        </div>
    </div>

    <main class="container my-5">
        <p id="mensagem-carregando" class="text-center text-muted py-5">
            <i class="bi bi-arrow-repeat"></i> Buscando repositório de artigos...
        </p>

        <div id="container-grade" class="row g-4 d-none">
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
