<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha</title>

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pagina-simples">
    <a href="perfil.html" class="voltar">
        ← Voltar
    </a>

    <div class="card">
        <h2>Alterar Senha</h2>
        <label>Senha Atual</label>
        <input
            type="password" id="senhaAtual">
        <label>Nova Senha</label>
        <input
            type="password" id="novaSenha">
        <label>Confirmar Nova Senha</label>
        <input
            type="password" id="confirmarSenha">
        <button
            id="atualizarSenha" class="btn-principal">
            Atualizar Senha
        </button>
    </div>

</div>
<script src="senha.js"></script>

</body>
</html>
