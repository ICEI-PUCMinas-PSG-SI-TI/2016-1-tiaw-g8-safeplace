<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfil do Usuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 400px;">
      <h5 class="text-center mb-3">Tela de Visualização de Perfil</h5>
      <h4 id="nome" class="text-center fw-bold"></h4>
      <hr>
      <p id="email" class="text-center text-muted"></p>
      <p id="telefone" class="text-center"></p>
      <p id="cidade" class="text-center"></p>
      <div class="d-flex justify-content-center gap-2 mt-3">
        <button class="btn btn-primary" onclick="editar()">Editar</button>
        <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
        <a href="favoritos.html" class="btn btn-success">Favoritos</a>
      </div>
    </div>

    <div id="form-edicao" class="card shadow-sm p-4 mx-auto mt-4 hidden" style="max-width: 400px;">
      <h5 class="text-center mb-3">Tela de Edição de Perfil</h5>

      <label for="editNome" class="fw-bold">Nome:</label>
      <input type="text" id="editNome" class="form-control mb-2">

      <label for="editEmail" class="fw-bold">E-mail:</label>
      <input type="email" id="editEmail" class="form-control mb-2">

      <label for="editTelefone" class="fw-bold">Telefone:</label>
      <input type="text" id="editTelefone" class="form-control mb-2">

      <label for="editCidade" class="fw-bold">Cidade:</label>
      <input type="text" id="editCidade" class="form-control mb-3">

      <div class="d-flex justify-content-center gap-2">
        <button class="btn btn-success" onclick="salvar()">Salvar</button>
        <button class="btn btn-secondary" onclick="cancelar()">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
