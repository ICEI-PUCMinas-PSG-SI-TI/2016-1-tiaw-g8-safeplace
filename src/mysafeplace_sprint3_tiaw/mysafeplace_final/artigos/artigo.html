<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mySafePlace – Artigo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
</head>

<body>

    <nav class="navbar navbar-expand-lg" id="navbar-principal">
        <div class="container">
            <a class="navbar-brand" href="../index.html">my<span class="marca-destaque">SafePlace</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="../agendamento/index.html">Consultas</a></li>
                    <li class="nav-item"><a class="nav-link" href="../chat/index.html">Chat</a></li>
                    <li class="nav-item"><a class="nav-link" href="../avaliacoes/index.html">Avaliações</a></li>
                    <li class="nav-item"><a class="nav-link" href="../perfil/index.html">Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="../agenda/index.html">Agenda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="index.html">Artigos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-0">
        <img id="capa-artigo" src="" alt="Imagem de capa" class="d-none" />
    </div>

    <main id="container-artigo" class="my-4">
        <p id="mensagem-carregando" class="text-center text-muted py-5">
            <i class="bi bi-arrow-repeat"></i> Carregando artigo...
        </p>

        <div id="conteudo-artigo" class="d-none">
            <div class="cabecalho-artigo">
                <span id="categoria-artigo" class="badge-categoria"></span>
                <h1 id="titulo-artigo" class="fw-bold mt-2 mb-3"></h1>
                <div class="meta-artigo d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div>
                        <span class="fw-bold" id="autor-artigo"></span> • <span id="data-artigo"></span>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="btn-curtir" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-heart"></i> <span id="likes-artigo">0</span>
                        </button>
                    </div>
                </div>
            </div>

            <article id="texto-artigo" class="corpo-artigo"></article>
        </div>
    </main>

    <section id="secao-relacionados">
        <div class="container">
            <h4 class="fw-bold mb-4 text-center text-md-start">Artigos Relacionados</h4>
            <div id="grade-relacionados" class="row"></div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../shared/supabase.js"></script>
    <script src="artigo.js"></script>
</body>

</html>
