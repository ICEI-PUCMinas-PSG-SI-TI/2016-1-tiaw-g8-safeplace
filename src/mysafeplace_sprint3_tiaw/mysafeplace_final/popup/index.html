<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MySafePlace – Início</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="../shared/global.css" rel="stylesheet" />
  <style>
    body { font-family: var(--msp-fonte); background: var(--msp-fundo); }
    #navbar-principal { background-color: var(--msp-verde-escuro) !important; }
    #navbar-principal .navbar-brand { color: #fff !important; font-weight: 800; font-size: 1.3rem; }
    .marca-destaque { color: #a8e6c1; }
    #navbar-principal .nav-link { color: rgba(255,255,255,0.8) !important; font-weight: 600; }
    #navbar-principal .nav-link:hover, #navbar-principal .nav-link.active { color: #fff !important; }
    #navbar-principal .navbar-toggler { border-color: rgba(255,255,255,0.3); }
    #navbar-principal .navbar-toggler-icon { filter: invert(1); }
    #secao-header { background: linear-gradient(135deg, var(--msp-verde-escuro), var(--msp-verde-medio)); padding: 2.5rem 1rem; text-align: center; }
    #secao-header h2 { color: white; font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
    #secao-header p { color: rgba(255,255,255,0.85); }

    /* popup */
    #popup-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9999; display:flex; align-items:center; justify-content:center; padding:16px; animation:popup-fade-in 0.3s ease; }
    #popup-overlay.popup-saindo { animation:popup-fade-out 0.3s ease forwards; }
    @keyframes popup-fade-in { from{opacity:0} to{opacity:1} }
    @keyframes popup-fade-out { from{opacity:1} to{opacity:0} }
    .popup-card { max-width:520px; width:100%; border-radius:18px !important; border:none !important; box-shadow:0 12px 48px rgba(0,0,0,0.25) !important; animation:popup-slide-up 0.35s ease; overflow:visible !important; }
    @keyframes popup-slide-up { from{transform:translateY(32px);opacity:0} to{transform:translateY(0);opacity:1} }
    .popup-card-header { background:#fff8f0; border-bottom:1px solid #ffe5cc; border-radius:18px 18px 0 0 !important; padding:20px 20px 14px; position:relative; display:flex; justify-content:center; align-items:center; }
    .popup-icone-alerta { font-size:2.5rem; color:#e67e22; }
    .popup-btn-fechar { position:absolute; top:12px; right:14px; background:none; border:none; font-size:1.1rem; color:#999; cursor:pointer; border-radius:6px; padding:4px; transition:color 0.2s,background 0.2s; }
    .popup-btn-fechar:hover { color:#333; background:#f0f0f0; }
    .popup-card-body { padding:24px 28px 20px; background:#fff; }
    .popup-titulo { font-size:1.35rem !important; font-weight:800 !important; color:#1a1a1a !important; margin-bottom:10px; }
    .popup-descricao { font-size:0.93rem; color:#555; line-height:1.6; margin-bottom:22px; }
    .popup-botoes { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .btn-urgente { background:#c0392b; color:#fff; font-weight:700; font-size:0.92rem; border:none; padding:11px 24px; border-radius:10px; cursor:pointer; transition:background 0.2s; }
    .btn-urgente:hover { background:#a93226; }
    .btn-continuar { background:#fff; color:#555; font-weight:600; font-size:0.92rem; border:1.5px solid #ccc; padding:11px 24px; border-radius:10px; cursor:pointer; transition:all 0.2s; }
    .btn-continuar:hover { background:#f5f5f5; }
    .popup-card-footer { background:#f9f9f9; border-top:1px solid #eee; border-radius:0 0 18px 18px !important; font-size:0.8rem; color:#aaa; padding:10px 20px; font-style:italic; }
    .popup-card-segundo .popup-card-header { background:#f0f7f4 !important; border-bottom:1px solid var(--msp-cinza-borda) !important; flex-direction:column; gap:4px; }
    .popup-segundo-titulo { font-size:1.2rem; font-weight:800; color:#1a1a1a; margin:0; }
    .popup-segundo-descricao { font-size:0.87rem; color:#666; margin:4px 0 0; }
    .popup-segundo-body { display:flex !important; flex-direction:column !important; gap:10px !important; padding:20px 24px !important; }
    .popup-opcao-atendimento { display:flex; align-items:center; gap:14px; background:#fff; border-radius:12px; border:1.5px solid var(--msp-cinza-borda); padding:12px 18px; text-align:left; cursor:pointer; transition:border-color 0.2s,background 0.2s; width:100%; }
    .popup-opcao-icone { font-size:1.4rem; flex-shrink:0; }
    .popup-opcao-titulo { font-weight:800; font-size:0.93rem; display:block; color:#1a1a1a; }
    .popup-opcao-desc { font-size:0.78rem; color:#777; display:block; }
    .opcao-chat { border-color:var(--msp-verde-medio); } .opcao-chat .popup-opcao-icone { color:var(--msp-verde-medio); }
    .opcao-chamada { border-color:#185fa5; } .opcao-chamada .popup-opcao-icone { color:#185fa5; }
    .opcao-cvv { border-color:#c0392b; } .opcao-cvv .popup-opcao-icone { color:#c0392b; }
    @media (max-width:480px) { .popup-card-body { padding:18px 16px !important; } .popup-botoes { flex-direction:column; } .btn-urgente, .btn-continuar { width:100%; } }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg" id="navbar-principal">
    <div class="container">
      <a class="navbar-brand" href="#">my<span style="color:#a8e6c1;">SafePlace</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="#">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="../artigos/index.html">Artigos</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Consultas</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Diário</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Chat</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div id="secao-header" class="py-4 text-center">
    <h2 class="fw-bold mb-1">Bem-vindo ao mySafePlace</h2>
    <p class="mb-0">Seu lugar seguro para falar sobre saúde mental</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/supabase.js"></script>
  <script src="popup.js"></script>
</body>
</html>
